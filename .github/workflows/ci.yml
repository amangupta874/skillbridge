name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sb
          POSTGRES_PASSWORD: sb
          POSTGRES_DB: skillbridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sb:sb@localhost:5432/skillbridge_test
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run verify
